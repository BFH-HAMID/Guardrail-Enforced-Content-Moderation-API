# Example reverse proxy for the moderation API. Copy, adjust cert paths, done.
# The two settings that actually matter are client_max_body_size (must not be smaller than
# GUARD_MAX_INPUT_CHARS or nginx 413s before the API can validate) and proxy_read_timeout
# (a slow LLM leg timing out here becomes a 502, which reads to clients as a moderation failure).

upstream guardrail_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name moderation.example.com;

    ssl_certificate     /etc/letsencrypt/live/moderation.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moderation.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    access_log /var/log/nginx/guardrail.access.log;
    error_log  /var/log/nginx/guardrail.error.log warn;

    # The API already answers unknown paths with JSON; do not let nginx swallow that.
    absolute_redirect off;

    location / {
        proxy_pass http://guardrail_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    90s;   # > GUARD_PIPELINE_REQUEST_TIMEOUT_S (60s) + slack

        # Never buffer a 503 fail-closed body into a generic error page: the client needs the
        # moderation envelope (blocked + retry_allowed), not nginx's HTML.
        proxy_intercept_errors off;
        proxy_buffering on;
    }

    # Prometheus scrape endpoint: cluster-internal only, and not behind the API key.
    location = /metrics {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://guardrail_api;
    }

    # Docs/OpenAPI - fine to expose to your team, remove for a public edge.
    location ~ ^/(docs|redoc|openapi.json)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://guardrail_api;
    }
}
